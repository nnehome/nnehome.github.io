<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 360" font-family="Georgia, 'Times New Roman', serif" font-size="16">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1f4e8c"/>
    </marker>
  </defs>

  <!-- Close: returns to the Full-information NNE overview -->
  <a href="../fnne/index.html" xlink:href="../fnne/index.html" target="_self">
    <title>Close</title>
    <text x="14" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#bbbbbb">&#10005;</text>
  </a>

  <!-- Dataset matrix D -->
  <g stroke="#3a7bd5" fill="none" stroke-width="1.5">
    <rect x="60" y="40" width="150" height="250"/>
    <line x1="60" y1="90"  x2="210" y2="90"/>
    <line x1="60" y1="140" x2="210" y2="140"/>
    <line x1="60" y1="240" x2="210" y2="240"/>
    <line x1="97"  y1="40" x2="97"  y2="290"/>
    <line x1="134" y1="40" x2="134" y2="290"/>
    <line x1="171" y1="40" x2="171" y2="290"/>
  </g>
  <!-- highlighted i=2 row -->
  <rect x="60" y="90" width="150" height="50" fill="#3a7bd5" opacity="0.12"/>
  <rect x="56" y="86" width="158" height="58" fill="none" stroke="#3a7bd5" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- row labels -->
  <text x="48" y="70"  text-anchor="end" font-style="italic">i = 1</text>
  <text x="48" y="120" text-anchor="end" font-style="italic">i = 2</text>
  <text x="48" y="270" text-anchor="end" font-style="italic">i = n</text>
  <text x="190" y="195" text-anchor="middle" fill="#888">&#8942;</text>
  <text x="135" y="312" text-anchor="middle" font-style="italic">&#119967;</text>

  <!-- per-observation feature arrows -->
  <g stroke="#1f4e8c" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="214" y1="65"  x2="300" y2="65"/>
    <line x1="214" y1="115" x2="300" y2="115"/>
    <line x1="214" y1="265" x2="300" y2="265"/>
  </g>
  <g text-anchor="start">
    <text x="306" y="70"><tspan font-weight="bold" font-style="italic">f</tspan><tspan font-size="11" dy="3">(in)</tspan></text>
    <text x="306" y="120"><tspan font-weight="bold" font-style="italic">f</tspan><tspan font-size="11" dy="3">(in)</tspan></text>
    <text x="306" y="270"><tspan font-weight="bold" font-style="italic">f</tspan><tspan font-size="11" dy="3">(in)</tspan></text>
  </g>
  <text x="318" y="195" text-anchor="middle" fill="#888">&#8942;</text>

  <!-- converge to average -->
  <g stroke="#1f4e8c" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="380" y1="70"  x2="475" y2="160"/>
    <line x1="380" y1="120" x2="475" y2="165"/>
    <line x1="380" y1="265" x2="475" y2="180"/>
  </g>

  <!-- average operator -->
  <text x="505" y="180" text-anchor="middle" font-size="30">&#8721;</text>
  <text x="505" y="150" text-anchor="middle" font-size="13">1/n</text>
  <text x="505" y="205" text-anchor="middle" font-size="11" font-style="italic">i=1..n</text>

  <!-- output network -->
  <line x1="535" y1="172" x2="605" y2="172" stroke="#1f4e8c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="612" y="177" text-anchor="start"><tspan font-weight="bold" font-style="italic">f</tspan><tspan font-size="11" dy="3">(out)</tspan></text>

  <!-- theta hat -->
  <line x1="678" y1="172" x2="715" y2="172" stroke="#1f4e8c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="735" y="178" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1f4e8c">&#952;&#770;</text>
</svg>
